<script>
'use strict';
// Fixtures transcribed from supplied screenshots; these are not live data.
let events=[],sport='mma',mode='prematch',market='outcomes',dateFilter='',query='',loading=true,error='',topOnly=false;
const selected=new Map(),collapsed=new Set(),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isFinite(n)?n.toFixed(2):'—';
function isTopFight(e){
if(e.cardInfo?.cancelled||e.metadataUnavailable)return false;
const description=[e.cardInfo?.stage,e.cardInfo?.highlight].filter(Boolean).join(' · ').toLowerCase();
const positive=description.split(' · ').filter(part=>!/(?:не\s+указ|уточня|нетитуль|без\s+титул|не\s+титуль)/i.test(part)).join(' · ');
const title=/(?:титульн|за\s+(?:вакантный\s+)?титул|титулы?\s+\S)/i.test(positive);
return e.sport==='boxing'?title:e.sport==='mma'&&(title||/(?:главный бой|соглавный бой|рейтинговый)/i.test(positive));
}
function render(){
const topButton=document.querySelector('.bottom-nav [data-action="top"]');if(topButton){topButton.classList.toggle('active',topOnly);topButton.setAttribute('aria-pressed',String(topOnly));}

const list=events.filter(e=>(topOnly?isTopFight(e):e.sport===sport)&&e.status===mode&&(!dateFilter||e.date===dateFilter)&&(!query||(e.title+' '+e.fighters.join(' ')+' '+(e.originalFighters||[]).join(' ')+' '+(e.cardInfo?.originalTitle||'')).toLocaleLowerCase('ru').includes(query)));
if(loading||error||!list.length){$('#events').innerHTML='<div class="empty"><strong>'+esc(loading?'Загрузка боёв…':error?'Не удалось загрузить события':'Нет событий')+'</strong>'+esc(error||(loading?'':query||dateFilter?'Попробуйте изменить поиск или дату.':mode==='live'?'Сейчас нет боёв в прямом эфире.':mode==='finished'?'Результаты пока не загружены.':'Для этого вида спорта события пока не загружены.'))+'</div>';return}
$('#events').innerHTML=list.map(e=>{const closed=collapsed.has(e.id),total=market==='totals',labels=total?['Тотал','Б','М']:['1','X','2'],values=total?(e.totals?[e.totals.line,e.totals.over,e.totals.under]:[]):e.odds;
return '<article class="event"><button class="event-title" data-event="'+esc(e.id)+'" aria-expanded="'+!closed+'"><span>'+esc(e.title)+'</span><span class="count">1</span></button>'+(!closed&&e.fighters.length?'<div class="event-head"><time>'+esc(e.date)+'</time>'+labels.map(l=>'<span>'+l+'</span>').join('')+'</div><div class="event-row"><div class="fighters">'+e.fighters.map((f,i)=>'<button class="fighter-link" data-fighter="'+esc(e.id)+'" data-person="'+i+'">'+esc(f)+'</button>').join('')+'</div>'+(mode==='finished'?'<div class="result">'+esc(e.result||'Результат уточняется')+'</div>':[0,1,2].map(i=>'<button class="odd '+(selected.has(e.id+market+i)?'selected':'')+'" data-odd="'+esc(e.id)+'" data-index="'+i+'" '+(!Number.isFinite(values[i])||total&&i===0?'disabled':'')+' aria-pressed="'+selected.has(e.id+market+i)+'" aria-label="'+esc(labels[i]+' '+fmt(values[i])+'; '+e.fighters.join(' — '))+'">'+(total&&i===0?(values[i]??'—'):fmt(values[i]))+'</button>').join(''))+'</div>':'')+'</article>'}).join('');
}

let menuDrag=null,menuMotion=null,menuClosing=false,menuSuppressClick=false;
const menuDialog=$('#panel'),menuHandle=menuDialog.querySelector('.menu-handle');
function resetMenuMotion(){menuDrag=null;menuClosing=false;if(menuMotion){menuMotion.cancel();menuMotion=null}menuDialog.style.animation='';menuDialog.style.transform=''}

 const from=getComputedStyle(menuDialog).transform;menuDialog.style.animation='none';if(menuMotion)menuMotion.cancel();menuClosing=closing;
 const motion=menuDialog.animate([{transform:from==='none'?'translateY(0)':from},{transform:`translateY(${y}px)`}],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:closing?240:300,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});menuMotion=motion;
 motion.finished.then(()=>{if(menuMotion!==motion)return;menuDialog.style.transform=`translateY(${y}px)`;motion.cancel();menuMotion=null;if(closing){menuDialog.close();resetMenuMotion()}}).catch(()=>{});
}

menuHandle.addEventListener('pointerdown',e=>{if(menuClosing||!e.isPrimary||e.button!==0)return;const matrix=new DOMMatrixReadOnly(getComputedStyle(menuDialog).transform);const offset=matrix.m42;menuDialog.style.animation='none';if(menuMotion){menuMotion.cancel();menuMotion=null}menuDialog.style.transform=`translateY(${offset}px)`;menuSuppressClick=false;menuDrag={id:e.pointerId,start:e.clientY,offset,y:offset,last:e.clientY,time:e.timeStamp,velocity:0,moved:false};menuHandle.setPointerCapture(e.pointerId)});
menuHandle.addEventListener('pointermove',e=>{const d=menuDrag;if(!d||d.id!==e.pointerId)return;const dt=e.timeStamp-d.time;if(dt>0)d.velocity=(e.clientY-d.last)/dt;d.last=e.clientY;d.time=e.timeStamp;d.moved ||= Math.abs(e.clientY-d.start)>5;d.y=Math.max(0,d.offset+e.clientY-d.start);menuDialog.style.transform=`translateY(${d.y}px)`});
function endMenuDrag(e,cancelled){const d=menuDrag;if(!d||d.id!==e.pointerId)return;menuDrag=null;menuSuppressClick=d.moved||cancelled;if(menuHandle.hasPointerCapture(e.pointerId))menuHandle.releasePointerCapture(e.pointerId);const fling=e.timeStamp-d.time<100&&d.velocity>.6&&d.y>30;moveMenuTo(!cancelled&&(d.y>Math.min(110,menuDialog.offsetHeight*.22)||fling)?menuDialog.offsetHeight+20:0,!cancelled&&(d.y>Math.min(110,menuDialog.offsetHeight*.22)||fling))}
menuHandle.addEventListener('pointerup',e=>endMenuDrag(e,false));menuHandle.addEventListener('pointercancel',e=>endMenuDrag(e,true));menuHandle.addEventListener('lostpointercapture',e=>endMenuDrag(e,true));
menuHandle.addEventListener('click',e=>{if(menuSuppressClick&&e.detail!==0){menuSuppressClick=false;return}closePanel()});
menuDialog.addEventListener('cancel',e=>{if(menuDialog.classList.contains('hamburger-sheet')){e.preventDefault();closePanel()}});menuDialog.addEventListener('close',resetMenuMotion);
function showSelections(){panel('Мои пари',selected.size?'<p>Выбранные исходы в макете. Ставки не отправляются.</p>'+[...selected.entries()].map(([key,s])=>'<div class="selection"><div>'+esc(s.fighters.join(' — '))+'<small>'+esc(s.label)+' · '+fmt(s.value)+'</small></div><button data-remove="'+esc(key)+'" aria-label="Удалить исход">×</button></div>').join(''):'<p>Пока нет выбранных исходов. Нажмите на коэффициент в списке боёв.</p>')}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.sport){topOnly=false;sport=b.dataset.sport;dateFilter='';render();return}if(b.dataset.mode){mode=b.dataset.mode;render();return}if(b.dataset.market){market=b.dataset.market;render();return}
if(b.dataset.fighter){if(window.openFight){window.openFight(b.dataset.fighter);return}const e=events.find(e=>e.id===b.dataset.fighter);if(e)panel(e.fighters[Number(b.dataset.person)],'<p>'+esc(e.title)+'</p><p>'+esc(e.fighters.join(' — '))+'</p><p>'+esc(e.date)+'</p><p>'+esc(e.sourceNote || 'Расписание: Boxing Data API. Коэффициенты бокса демонстрационные.')+'</p>');return}
if(b.dataset.event){collapsed.has(b.dataset.event)?collapsed.delete(b.dataset.event):collapsed.add(b.dataset.event);render();return}
if(b.dataset.odd){const e=events.find(e=>e.id===b.dataset.odd),i=Number(b.dataset.index),key=e.id+market+i;if(selected.has(key))selected.delete(key);else{for(const k of selected.keys())if(k.startsWith(e.id+market))selected.delete(k);selected.set(key,{fighters:e.fighters,label:market==='outcomes'?['Победа 1','Ничья','Победа 2'][i]:['Тотал','Больше','Меньше'][i],value:market==='outcomes'?e.odds[i]:[e.totals.line,e.totals.over,e.totals.under][i]})}render();return}
if(b.dataset.remove){selected.delete(b.dataset.remove);render();showSelections();return}
switch(b.dataset.action){case'close':closePanel();break;case'search':$('.search-box').hidden=!$('.search-box').hidden;if(!$('.search-box').hidden)$('#search').focus();else{query='';$('#search').value='';render()}break;
case'menu':panel('Меню',window.freebkMenuContent());break;
case'menu-live':case'menu-prematch':topOnly=false;mode=b.dataset.action==='menu-live'?'live':'prematch';market='outcomes';$('#panel').close();render();window.scrollTo({top:0,behavior:'smooth'});break;
case'broadcasts':window.openBroadcastScreen();break;
case'mma':case'boxing':sport=b.dataset.action==='mma'?'mma':'boxing';mode='prematch';dateFilter='';$('#panel').close();render();break;
case'results':topOnly=false;mode='finished';market='outcomes';$('#panel').close();render();break;
case'about':panel('О макете','<p>P2P Market. Доступны MMA и бокс. Линия букмекеров: The Odds API. Денежные ставки не принимаются.</p>');break;
case'settings':panel('Отображение','<div class="dialog-options"><button data-action="density">'+($('#app').classList.contains('dense')?'Обычная':'Компактная')+' плотность</button></div>');break;
case'density':$('#app').classList.toggle('dense');$('#panel').close();break;
case'top':if($('#panel').open)$('#panel').close();topOnly=true;market='outcomes';mode='prematch';dateFilter='';query='';$('#search').value='';$('.search-box').hidden=true;render();window.scrollTo({top:0,behavior:'smooth'});break;
case'sport':topOnly=false;render();window.scrollTo({top:0,behavior:'smooth'});break;
case'bets':showSelections();break;
case'games':panel('Игры 24/7','<p>Раздел из референса. В этом макете доступны экраны единоборств и бокса.</p>');break;
case'profile':panel('Профиль','<p>Профиль появится после подключения аккаунта Telegram.</p>');break;}});
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLocaleLowerCase('ru');render()});
$('#panel').addEventListener('click',e=>{if(e.target===$('#panel')){const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)closePanel()}});
// Provider-independent integration interface; call setEvents with normalized API data.
window.FightScreen={setEvents(data){if(!Array.isArray(data)||data.some(e=>!e||typeof e.id!=='string'||typeof e.title!=='string'||!Array.isArray(e.fighters)||!e.fighters.every(f=>typeof f==='string')||!Array.isArray(e.odds)||!e.odds.every(n=>n===null||Number.isFinite(n))||typeof e.sport!=='string'||typeof e.status!=='string'))throw new TypeError('Invalid event data');events=data;selected.clear();loading=false;error='';render()},setLoading(value){loading=Boolean(value);render()},setError(message){loading=false;error=String(message||'');render()},setSport(value){if(!['mma','boxing'].includes(value))throw new TypeError('Unknown sport');sport=value;topOnly=false;dateFilter='';render()},getState(){return{sport,mode,market,topOnly,eventCount:events.length}}};
if(document.modelContext?.registerTool){const lifecycle=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'show_combat_sport',title:'Открыть вид единоборств',description:'Переключает вид спорта в списке боёв.',inputSchema:{type:'object',properties:{sport:{type:'string',enum:['mma','boxing']}},required:['sport'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||!['mma','boxing'].includes(input.sport))throw new TypeError('Expected mma or boxing');window.FightScreen.setSport(input.sport);return window.FightScreen.getState()}},{signal:lifecycle.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
render();
