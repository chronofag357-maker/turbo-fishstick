<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f8"><title>Единоборства — Прематч</title>
<style>

t{background:#eaeaf1;border-radius:2px;color:#7b7e92;font-size:12px;font-weight:700;padding:5px 6px;line-height:16px}.market.active{color:white;background:var(--blue)}.event{border-bottom:1px solid var(--line)}.event-title{width:100%;display:flex;align-items:center;gap:10px;padding:16px 15px;min-height:69px;text-align:left;line-height:1.08;font-size:17px;font-weight:500;letter-spacing:.12px}.event-title span:first-child{flex:1}.count{display:flex;align-items:center;justify-content:center;flex:0 0 40px;height:25px;border-radius:5px;background:#4c526b;color:white;font-size:16px;font-weight:700}.event-head,.event-row{display:grid;grid-template-columns:56.7% repeat(3,14.433%)}.event-head{height:35px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;color:#555b72}.event-head time{padding-left:39px;font-size:14px;font-weight:750;color:var(--ink);white-space:nowrap}.event-head>span{text-align:center}.event-row{min-height:73px}.fighters{margin-left:30px;background:white;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px;font-size:17px;line-height:1.2;letter-spacing:.1px;min-width:0}.fighters span{overflow-wrap:anywhere}.odd{background:var(--cell);font-size:17px;font-weight:750;padding:0 2px;font-variant-numeric:tabular-nums}.odd:nth-child(3){background:white}.odd.selected{background:var(--blue);color:white}.odd:hover:not(.selected):not(:disabled){background:#e8eaf2}.filter-fab{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));margin-left:20px;width:60px;height:60px;border:1px solid #cdcfdc;border-radius:11px;display:grid;place-items:center;background:var(--bg);z-index:6}.filter-fab svg{width:27px;height:27px;stroke-width:2.6}.bottom-nav{position:fixed;bottom:0;width:100%;max-width:450px;height:calc(65px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:white;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 0 4px;gap:5px;font-size:12px;white-space:nowrap;color:var(--muted)}.nav-item svg{width:28px;height:28px;stroke-width:2.5}.nav-item.active{color:var(--blue)}.dot{position:absolute;top:5px;right:14px;width:4px;height:4px;border-radius:50%;background:#0968c0}.empty{padding:38px 24px;text-align:center;color:#777b92;font-size:15px;line-height:1.5}.empty strong{display:block;color:var(--ink);margin-bottom:8px}.search-box{padding:0 20px 12px}.search-box input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink)}[hidden]{display:none!important}dialog{position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,450px);max-width:100%;max-height:80dvh;overflow:auto;border:0;border-radius:16px 16px 0 0;padding:23px 24px calc(26px + env(safe-area-inset-bottom));color:var(--ink);background:white}dialog::backdrop{background:#171b3655}dialog h2{font-size:21px;margin:0 40px 20px 0}dialog p{line-height:1.5;color:#777b92}.close{position:absolute;right:16px;top:14px;width:40px;height:40px;font-size:26px;color:var(--muted)}.dialog-options{display:grid;gap:10px}.dialog-options button{padding:13px 16px;background:var(--blue);color:white;border-radius:6px;text-align:left}.dialog-options label{display:grid;gap:8px;margin-bottom:10px}.dialog-options select{padding:12px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink)}.selection{border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.selection small{display:block;color:#777b92;margin-top:6px}.selection button{font-size:22px;color:var(--muted)}.dense .event-title{padding-top:10px;padding-bottom:10px}.dense .event-row{min-height:58px}.dense .fighters{gap:5px}.dense .event-head{height:30px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.result{grid-column:2/5;display:grid;place-items:center;padding:8px;font-size:14px;text-align:center}
@media(min-width:600px){.app{box-shadow:0 0 40px #20243f0b}}@media(max-width:360px){.topbar{gap:8px;padding:0 9px}.mode{font-size:21px}.modes{gap:12px}.event-title{font-size:16px}.event-head time{padding-left:20px;font-size:12px}.fighters{margin-left:15px;font-size:16px}.odd{font-size:16px}.sports{gap:15px}}
</style></head><body>

<main class="app" id="app"><header class="header"><div class="topbar"><button class="icon-button" aria-label="Меню" data-action="menu"><svg><use href="#i-menu"/></svg></button><div class="modes" aria-label="Режим событий"><button class="mode" data-mode="live" aria-pressed="false">Live</button><button class="mode active" data-mode="prematch" aria-pressed="true">Прематч</button></div><button class="icon-button" aria-label="Поиск боёв" data-action="search"><svg><use href="#i-search"/></svg></button><button class="icon-button" aria-label="Настройки отображения" data-action="settings"><svg><use href="#i-settings"/></svg></button></div>

<section id="events" aria-label="Список боёв" aria-live="polite"></section><button class="filter-fab" aria-label="Фильтр по дате" data-action="filter"><svg><use href="#i-filter"/></svg></button><nav class="bottom-nav" aria-label="Основная навигация"><button class="nav-item" data-action="top"><svg><use href="#i-fire"/></svg>Топ</button><button class="nav-item active" data-action="sport"><svg><use href="#i-sport"/></svg>Спорт</button><button class="nav-item" data-action="bets"><svg><use href="#i-ticket"/></svg>Мои пари</button><button class="nav-item" data-action="games"><svg><use href="#i-zap"/></svg>Игры 24/7</button><button class="nav-item" data-action="profile"><svg><use href="#i-user"/></svg>Профиль<span class="dot"></span></button></nav></main>
<dialog id="panel" aria-labelledby="panel-title"><button class="close" aria-label="Закрыть" data-action="close">×</button><h2 id="panel-title"></h2><div id="panel-body"></div></dialog>
<script>
'use strict';
// Fixtures transcribed from supplied screenshots; these are not live data.
const demoEvents=[
{id:'ufc-288-main',sport:'mma',status:'prematch',title:'ММА. UFC Fight Night 288. Глендейл. Главный бой вечера. Полулегкий вес. 5 раундов',date:'13 СЕНТЯБРЯ В 05:40',fighters:['Жеан Силва','Хосе Дельгадо'],odds:[1.20,66.00,4.80]},
{id:'ufc-331-title',sport:'mma',status:'prematch',title:'ММА. UFC 331. Лос-Анджелес. Титульный бой. Наилегчайший вес. 5 раундов',date:'20 СЕНТЯБРЯ В 04:00',fighters:['Джошуа Ван','Алешандре Пантожа'],odds:[1.87,50.00,1.97]},
{id:'ufc-331-light',sport:'mma',status:'prematch',title:'ММА. UFC 331. Лос-Анджелес. Рейтинговый бой. Легкий вес. 5 раундов',date:'20 СЕНТЯБРЯ В 04:00',fighters:['Арман Царукян','Маурисио Руффи'],odds:[1.26,65.00,4.05]},
{id:'ufc-333',sport:'mma',status:'prematch',title:'ММА. UFC 333. Остров Яс. Абу-Даби. Титульный бой. Легчайший вес. 5 раундов',date:'',fighters:[],odds:[]},
{id:'boxing-title',sport:'boxing',status:'prematch',title:'Титульные бои. 12 раундов. Полусредний вес',date:'13 СЕНТЯБРЯ В 04:30',fighters:['Райан Гарсия','Конор Бенн'],odds:[1.40,17.00,3.25]}
];
let events=demoEvents,sport='mma',mode='prematch',market='outcomes',dateFilter='',query='',loading=false,error='';
const selected=new Map(),collapsed=new Set(),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isFinite(n)?n.toFixed(2):'—';
function render(){
for(const [attr,value] of [['sport',sport],['mode',mode],['market',market]])document.querySelectorAll('[data-'+attr+']').forEach(b=>{b.classList.toggle('active',b.dataset[attr]===value);b.setAttribute('aria-pressed',String(b.dataset[attr]===value))});
const list=events.filter(e=>e.sport===sport&&e.status===mode&&(!dateFilter||e.date===dateFilter)&&(!query||(e.title+' '+e.fighters.join(' ')).toLocaleLowerCase('ru').includes(query)));
if(loading||error||!list.length){$('#events').innerHTML='<div class="empty"><strong>'+esc(loading?'Загрузка боёв…':error?'Не удалось загрузить события':'Нет событий')+'</strong>'+esc(error||(loading?'':query||dateFilter?'Попробуйте изменить поиск или дату.':mode==='live'?'Сейчас нет боёв в прямом эфире.':mode==='finished'?'Результаты пока не загружены.':'Для этого вида спорта события пока не загружены.'))+'</div>';return}
$('#events').innerHTML=list.map(e=>{const closed=collapsed.has(e.id),total=market==='totals',labels=total?['Тотал','Б','М']:['1','X','2'],values=total?(e.totals?[e.totals.line,e.totals.over,e.totals.under]:[]):e.odds;
return '<article class="event"><button class="event-title" data-event="'+esc(e.id)+'" aria-expanded="'+!closed+'"><span>'+esc(e.title)+'</span><span class="count">1</span></button>'+(!closed&&e.fighters.length?'<div class="event-head"><time>'+esc(e.date)+'</time>'+labels.map(l=>'<span>'+l+'</span>').join('')+'</div><div class="event-row"><div class="fighters">'+e.fighters.map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+(mode==='finished'?'<div class="result">'+esc(e.result||'Результат уточняется')+'</div>':[0,1,2].map(i=>'<button class="odd '+(selected.has(e.id+market+i)?'selected':'')+'" data-odd="'+esc(e.id)+'" data-index="'+i+'" '+(!Number.isFinite(values[i])||total&&i===0?'disabled':'')+' aria-pressed="'+selected.has(e.id+market+i)+'" aria-label="'+esc(labels[i]+' '+fmt(values[i])+'; '+e.fighters.join(' — '))+'">'+(total&&i===0?(values[i]??'—'):fmt(values[i]))+'</button>').join(''))+'</div>':'')+'</article>'}).join('');
}
function panel(title,html){$('#panel-title').textContent=title;$('#panel-body').innerHTML=html;if(!$('#panel').open)$('#panel').showModal()}
function showSelections(){panel('Мои пари',selected.size?'<p>Выбранные исходы в макете. Ставки не отправляются.</p>'+[...selected.entries()].map(([key,s])=>'<div class="selection"><div>'+esc(s.fighters.join(' — '))+'<small>'+esc(s.label)+' · '+fmt(s.value)+'</small></div><button data-remove="'+esc(key)+'" aria-label="Удалить исход">×</button></div>').join(''):'<p>Пока нет выбранных исходов. Нажмите на коэффициент в списке боёв.</p>')}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.sport){sport=b.dataset.sport;dateFilter='';render();return}if(b.dataset.mode){mode=b.dataset.mode;render();return}if(b.dataset.market){market=b.dataset.market;render();return}
if(b.dataset.event){collapsed.has(b.dataset.event)?collapsed.delete(b.dataset.event):collapsed.add(b.dataset.event);render();return}
if(b.dataset.odd){const e=events.find(e=>e.id===b.dataset.odd),i=Number(b.dataset.index),key=e.id+market+i;if(selected.has(key))selected.delete(key);else{for(const k of selected.keys())if(k.startsWith(e.id+market))selected.delete(k);selected.set(key,{fighters:e.fighters,label:market==='outcomes'?['Победа 1','Ничья','Победа 2'][i]:['Тотал','Больше','Меньше'][i],value:market==='outcomes'?e.odds[i]:[e.totals.line,e.totals.over,e.totals.under][i]})}render();return}
if(b.dataset.remove){selected.delete(b.dataset.remove);render();showSelections();return}
switch(b.dataset.action){case'close':$('#panel').close();break;case'search':$('.search-box').hidden=!$('.search-box').hidden;if(!$('.search-box').hidden)$('#search').focus();else{query='';$('#search').value='';render()}break;
case'menu':panel('Спорт','<div class="dialog-options"><button data-action="mma">Единоборства · UFC</button><button data-action="boxing">Бокс</button><button data-action="results">Результаты</button><button data-action="about">О макете</button></div>');break;
case'mma':case'boxing':sport=b.dataset.action==='mma'?'mma':'boxing';mode='prematch';dateFilter='';$('#panel').close();render();break;
case'results':mode='finished';$('#panel').close();render();break;
case'about':panel('О макете','<p>Дизайн по предоставленным скриншотам. Бои, даты и коэффициенты — демонстрационные данные из референсов. API пока не подключён.</p>');break;
case'settings':panel('Отображение','<div class="dialog-options"><button data-action="density">'+($('#app').classList.contains('dense')?'Обычная':'Компактная')+' плотность</button></div>');break;
case'density':$('#app').classList.toggle('dense');$('#panel').close();break;
case'filter':panel('Дата события','<div class="dialog-options"><label>Показать бои<select id="date-filter"><option value="">Все даты</option>'+[...new Set(events.filter(e=>e.sport===sport&&e.status===mode&&e.date).map(e=>e.date))].map(d=>'<option '+(dateFilter===d?'selected':'')+' value="'+esc(d)+'">'+esc(d)+'</option>').join('')+'</select></label><button data-action="apply-filter">Применить</button></div>');break;
case'apply-filter':dateFilter=$('#date-filter').value;$('#panel').close();render();break;
case'top':case'sport':window.scrollTo({top:0,behavior:'smooth'});if(mode==='finished'){mode='prematch';render()}break;
case'bets':showSelections();break;
case'games':panel('Игры 24/7','<p>Раздел из референса. В этом макете доступны экраны единоборств и бокса.</p>');break;
case'profile':panel('Профиль','<p>Профиль появится после подключения аккаунта Telegram.</p>');break;}});
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLocaleLowerCase('ru');render()});
$('#panel').addEventListener('click',e=>{if(e.target===$('#panel')){const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)e.target.close()}});
// Provider-independent integration interface; call setEvents with normalized API data.
window.FightScreen={setEvents(data){if(!Array.isArray(data)||data.some(e=>!e||typeof e.id!=='string'||typeof e.title!=='string'||!Array.isArray(e.fighters)||!e.fighters.every(f=>typeof f==='string')||!Array.isArray(e.odds)||!e.odds.every(n=>n===null||Number.isFinite(n))||typeof e.sport!=='string'||typeof e.status!=='string'))throw new TypeError('Invalid event data');events=data;selected.clear();collapsed.clear();dateFilter='';loading=false;error='';render()},setLoading(value){loading=Boolean(value);render()},setError(message){loading=false;error=String(message||'');render()},setSport(value){if(!['mma','boxing','football','hockey','tennis'].includes(value))throw new TypeError('Unknown sport');sport=value;dateFilter='';render()},getState(){return{sport,mode,market,eventCount:events.length}}};
if(document.modelContext?.registerTool){const lifecycle=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'show_combat_sport',title:'Открыть вид единоборств',description:'Переключает вид спорта в списке боёв.',inputSchema:{type:'object',properties:{sport:{type:'string',enum:['mma','boxing']}},required:['sport'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||!['mma','boxing'].includes(input.sport))throw new TypeError('Expected mma or boxing');window.FightScreen.setSport(input.sport);return window.FightScreen.getState()}},{signal:lifecycle.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
render();
</script></body></html>
